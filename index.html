<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bé Học Tiếng Anh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
    background: linear-gradient(160deg, #a8e6ff 0%, #d6f5d6 50%, #fff5cc 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 12px;
  }

  /* ============ MÀN HÌNH CHỌN CHỦ ĐỀ ============ */
  #menuScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 900px;
  }
  #menuScreen h1 {
    font-size: clamp(24px, 5.5vw, 42px);
    color: #ff6b9d;
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,0.1);
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    font-size: clamp(14px, 3vw, 19px);
    color: #4a90d9;
    margin-bottom: 22px;
    text-align: center;
  }
  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: clamp(10px, 2.5vw, 18px);
    width: 100%;
    padding: 0 8px;
  }
  .topic-card {
    background: #fff;
    border: 5px solid #7ed6a5;
    border-radius: 22px;
    padding: clamp(12px, 3vw, 20px) 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-shadow: 0 6px 0 #5cb884, 0 10px 20px rgba(0,0,0,0.12);
    transition: transform 0.15s, box-shadow 0.15s;
    text-align: center;
    font-family: inherit;
  }
  .topic-card:hover { transform: translateY(-4px) scale(1.03); }
  .topic-card:active {
    transform: translateY(4px) scale(1.01);
    box-shadow: 0 2px 0 #5cb884;
  }
  .topic-card .emoji {
    font-size: clamp(36px, 8vw, 52px);
    line-height: 1;
  }
  .topic-card .name {
    font-size: clamp(14px, 3vw, 18px);
    font-weight: bold;
    color: #2d6a4f;
  }
  .topic-card .progress {
    font-size: clamp(11px, 2.3vw, 13px);
    color: #888;
  }
  /* màu viền theo chủ đề */
  .topic-card[data-topic="animals"]   { border-color: #ffb74d; box-shadow: 0 6px 0 #e69138; }
  .topic-card[data-topic="fruits"]    { border-color: #ef5350; box-shadow: 0 6px 0 #c62828; }
  .topic-card[data-topic="objects"]   { border-color: #42a5f5; box-shadow: 0 6px 0 #1565c0; }
  .topic-card[data-topic="vehicles"]  { border-color: #ab47bc; box-shadow: 0 6px 0 #6a1b9a; }
  .topic-card[data-topic="colors"]    { border-color: #26c6da; box-shadow: 0 6px 0 #00838f; }
  .topic-card[data-topic="numbers"]   { border-color: #ff7043; box-shadow: 0 6px 0 #d84315; }
  .topic-card[data-topic="body"]      { border-color: #66bb6a; box-shadow: 0 6px 0 #2e7d32; }
  .topic-card[data-topic="family"]    { border-color: #ec407a; box-shadow: 0 6px 0 #ad1457; }

  /* ============ MÀN HÌNH CHƠI ============ */
  #gameScreen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  #gameScreen.active { display: flex; }

  .top-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-back {
    background: #fff;
    border: 3px solid #ffb3c6;
    color: #ff4081;
    font-family: inherit;
    font-size: clamp(13px, 2.8vw, 16px);
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 #ffcfe0;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn-back:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #ffcfe0;
  }
  .score {
    font-size: clamp(15px, 3vw, 20px);
    color: #4a90d9;
    background: #fff;
    padding: 6px 18px;
    border-radius: 30px;
    box-shadow: 0 4px 0 #c9e2f5;
    font-weight: bold;
  }
  .streak {
    font-size: clamp(15px, 3vw, 20px);
    color: #f57c00;
    background: #fff3e0;
    padding: 6px 18px;
    border-radius: 30px;
    box-shadow: 0 4px 0 #ffe0b2;
    font-weight: bold;
    display: none;
  }
  .streak.show { display: inline-block; }
  .topic-badge {
    background: #fff;
    padding: 6px 16px;
    border-radius: 30px;
    font-size: clamp(13px, 2.8vw, 17px);
    font-weight: bold;
    color: #2d6a4f;
    box-shadow: 0 4px 0 #d8f0e2;
    margin-bottom: 10px;
  }

  .speaker-btn {
    width: clamp(70px, 16vw, 100px);
    height: clamp(70px, 16vw, 100px);
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #ffe27a, #ffb300);
    box-shadow: 0 8px 0 #d98e00, 0 12px 25px rgba(0,0,0,0.2);
    font-size: clamp(32px, 7vw, 46px);
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
  }
  .speaker-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #d98e00, 0 4px 10px rgba(0,0,0,0.2);
  }
  .speaker-btn.playing { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse {
    from { transform: scale(1); }
    to   { transform: scale(1.1); }
  }

  .hint {
    font-size: clamp(13px, 2.6vw, 17px);
    color: #7a7a7a;
    margin-bottom: 16px;
    text-align: center;
    padding: 0 10px;
    min-height: 22px;
  }
  .hint.urgent { color: #ff5722; font-weight: bold; }

  .choices {
    display: flex;
    gap: clamp(15px, 4vw, 45px);
    padding: 0 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .choice {
    width: clamp(110px, 26vw, 180px);
    height: clamp(110px, 26vw, 180px);
    background: #fff;
    border: 6px solid #7ed6a5;
    border-radius: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(55px, 13vw, 95px);
    box-shadow: 0 8px 0 #5cb884, 0 12px 25px rgba(0,0,0,0.15);
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.2s;
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.4s ease;
    padding: 6px;
  }
  .choice img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  .choice:hover { transform: scale(1.04); }
  .choice:active {
    transform: translateY(6px) scale(1.02);
    box-shadow: 0 2px 0 #5cb884, 0 4px 10px rgba(0,0,0,0.15);
  }
  .choice.correct {
    border-color: #ffd700;
    background: #fffbe6;
    box-shadow: 0 0 0 8px rgba(255,215,0,0.35), 0 8px 0 #d9b400;
    animation: correctPop 0.5s ease;
  }
  @keyframes correctPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1.05); }
  }
  .choice.wrong {
    border-color: #ff8a8a;
    background: #fff0f0;
    animation: shake 0.45s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-12px); }
    40%     { transform: translateX(12px); }
    60%     { transform: translateX(-8px); }
    80%     { transform: translateX(8px); }
  }
  .choice.hintGlow {
    animation: hintGlow 0.7s ease infinite alternate;
  }
  @keyframes hintGlow {
    from { box-shadow: 0 8px 0 #5cb884, 0 0 0 0 rgba(255,235,59,0); }
    to   { box-shadow: 0 8px 0 #5cb884, 0 0 0 16px rgba(255,235,59,0.4); }
  }
  .choice.disabled { pointer-events: none; opacity: 0.85; }

  /* ============ PHÁO HOA + KHEN ============ */
  #fireworks {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
  }
  #praise {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(26px, 6.5vw, 54px);
    font-weight: bold;
    color: #ff4081;
    text-shadow: 4px 4px 0 #fff, 7px 7px 0 rgba(0,0,0,0.12);
    z-index: 1000;
    pointer-events: none;
    white-space: nowrap;
    text-align: center;
    padding: 0 12px;
  }
  #praise.show { animation: praiseIn 1.8s ease forwards; }
  @keyframes praiseIn {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-15deg); opacity: 0; }
    35%  { transform: translate(-50%,-50%) scale(1.25) rotate(4deg); opacity: 1; }
    50%  { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    80%  { transform: translate(-50%,-50%) scale(1.05); opacity: 1; }
    100% { transform: translate(-50%,-90%) scale(0.9); opacity: 0; }
  }

  /* ============ NÚT RESET ============ */
  #resetBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,0.9);
    border: 2px solid #ddd;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }
  #resetBtn:hover { background: #fff; border-color: #ff4081; }
</style>
</head>

/* Nhóm từ dễ nhầm — dùng để tạo câu hỏi khó ở cấp cao */
const CONFUSING_GROUPS = [
  ["cat","dog","rabbit","bear","lion","tiger"],
  ["apple","strawberry","watermelon","banana","peach","cherry"],

/* ================================================================
   2. ÂM THANH
   ================================================================ */
let englishVoice = null;
let vietnameseVoice = null;

function pickVoices() {
  const voices = speechSynthesis.getVoices();
  const prefer = ["Google UK English Female","Google US English",
                  "Samantha","Karen","Microsoft Zira","Microsoft Aria"];
  englishVoice = null;
  for (const name of prefer) {
    const v = voices.find(v => v.name === name);
    if (v) { englishVoice = v; break; }
  }
  if (!englishVoice) englishVoice = voices.find(v => v.lang && v.lang.startsWith("en")) || null;
  vietnameseVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("vi")) || null;
}
speechSynthesis.onvoiceschanged = pickVoices;
pickVoices();

function speakWord(text, rate = 0.8) {
  return new Promise((resolve) => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate; u.pitch = 1.25; u.volume = 1;
    if (englishVoice) u.voice = englishVoice;
    u.onend = resolve; u.onerror = resolve;
    speechSynthesis.speak(u);
    setTimeout(resolve, 2500);
  });
}

function speakPraise(text) {
  return new Promise((resolve) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "vi-VN"; u.rate = 0.95; u.pitch = 1.3; u.volume = 1;
    if (vietnameseVoice) u.voice = vietnameseVoice;
    u.onend = resolve; u.onerror = resolve;
    speechSynthesis.speak(u);
    setTimeout(resolve, 2600);
  });
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playDingSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    [880, 1320, 1760].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + i * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.28, now + i * 0.09 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.5);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.09); osc.stop(now + i * 0.09 + 0.55);
    });
  } catch (e) {}
}

function playApplauseSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const duration = 1.6;
    const sr = ctx.sampleRate;
    const buf = ctx.createBuffer(1, sr * duration, sr);
    const data = buf.getChannelData(0);
    const clapTimes = [];
    for (let i = 0; i < 55; i++) clapTimes.push(Math.random() * (duration - 0.15));
    clapTimes.forEach(t => {
      const start = Math.floor(t * sr);
      const clapLen = Math.floor(0.04 * sr);
      for (let j = 0; j < clapLen; j++)
        data[start + j] += (Math.random() * 2 - 1) * (1 - j / clapLen) * 0.6;
    });
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass"; filter.frequency.value = 1800; filter.Q.value = 0.7;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.55, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(now); src.stop(now + duration);
  } catch (e) {}
}

function playWrongSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.28);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.32);
  } catch (e) {}
}

/* ================================================================
   3. BỘ NHỚ (localStorage)
   ================================================================ */
const STORAGE_KEY = "beHocTiengAnh_v3";

let memory = {
  score: 0,
  streak: 0,
  bestStreak: 0,
  level: 1,
  totalCorrect: 0,
  totalWrong: 0,
  currentTopic: "animals",
  wordStats: {}   // { "apple": { correct, wrong, lastSeen } }
};

function loadMemory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) memory = { ...memory, ...JSON.parse(raw) };
  } catch (e) {}
}
function saveMemory() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(memory)); } catch (e) {}
}
function getWordStat(word) {
  if (!memory.wordStats[word]) memory.wordStats[word] = { correct: 0, wrong: 0, lastSeen: 0 };
  return memory.wordStats[word];
}
function getWordWeakness(word) {
  const s = getWordStat(word);
  const total = s.correct + s.wrong;
  if (total === 0) return 1.5;
  const accuracy = s.correct / total;
  const hoursSince = (Date.now() - s.lastSeen) / 3600000;
  return (1 - accuracy) * 3 + Math.min(hoursSince / 24, 2) + s.wrong * 0.5;
}

/* ================================================================
   4. HÀM TIỆN ÍCH
   ================================================================ */
const randInt = n => Math.floor(Math.random() * n);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Render nội dung 1 lựa chọn: ưu tiên img, nếu không có thì emoji */
function renderChoiceContent(el, item) {
  el.innerHTML = "";
  if (item.img) {
    const img = document.createElement("img");
    img.src = item.img;
    img.alt = item.word;
    img.onerror = () => { el.textContent = item.emoji; }; // fallback nếu ảnh lỗi
    el.appendChild(img);
  } else {
    el.textContent = item.emoji;
  }
}

/* Danh sách câu khen đa dạng */
const PRAISES = [
  "Bé đã trả lời đúng rồi!",
  "Bé giỏi quá!",
  "Tuyệt vời! Bé làm đúng rồi!",
  "Bé thông minh lắm!",
  "Đúng rồi! Bé học nhanh quá!",
  "Chính xác! Bé giỏi lắm!"
];
const PRAISE_TEXTS = [
  "🎉 Bé giỏi lắm! 🎉",
  "🌟 Tuyệt vời! 🌟",
  "🎊 Bé đúng rồi! 🎊",
  "💯 Xuất sắc! 💯",
  "🚀 Bé học siêu quá! 🚀"
];

/* ================================================================
   5. LOGIC GAME
   ================================================================ */
const menuScreen = document.getElementById("menuScreen");
const gameScreen = document.getElementById("gameScreen");
const topicsGrid = document.getElementById("topicsGrid");
const topicBadge = document.getElementById("topicBadge");
const speakerBtn = document.getElementById("speakerBtn");
const choicesEl  = document.getElementById("choices");
const scoreEl    = document.getElementById("score");
const streakEl   = document.getElementById("streak");
const streakWrap = document.getElementById("streakEl");
const hintEl     = document.getElementById("hint");
const praiseEl   = document.getElementById("praise");
const btnBack    = document.getElementById("btnBack");
const resetBtn   = document.getElementById("resetBtn");

let currentWord = null;
let currentChoices = [];
let correctIndex = 0;
let locked = false;
let wrongThisRound = 0;

/* --- Hiển thị menu chủ đề --- */
function showMenu() {
  gameScreen.classList.remove("active");
  menuScreen.style.display = "flex";
  renderTopicsGrid();
  speechSynthesis.cancel();
}

/* --- Vào game với chủ đề đã chọn --- */
async function startTopic(topicKey) {
  memory.currentTopic = topicKey;
  saveMemory();
  menuScreen.style.display = "none";
  gameScreen.classList.add("active");

  const topic = TOPICS[topicKey];
  topicBadge.textContent = topic.emoji + " " + topic.name;
  updateStats();

  await newRound();
}

/* --- Render grid chủ đề --- */
function renderTopicsGrid() {
  topicsGrid.innerHTML = "";
  for (const key in TOPICS) {
    const t = TOPICS[key];
    const known = t.words.filter(w => (memory.wordStats[w.word]?.correct || 0) > 0).length;

    const card = document.createElement("button");
    card.className = "topic-card";
    card.dataset.topic = key;
    card.innerHTML = `
      <div class="emoji">${t.emoji}</div>
      <div class="name">${t.name}</div>
      <div class="progress">${known}/${t.words.length} từ</div>
    `;
    card.addEventListener("click", () => startTopic(key));
    topicsGrid.appendChild(card);
  }
}

/* --- Cập nhật stats trên header --- */
function updateStats() {
  scoreEl.textContent = memory.score;
  streakEl.textContent = memory.streak;
  if (memory.streak >= 3) streakWrap.classList.add("show");
  else streakWrap.classList.remove("show");
}

/* --- Chọn từ đúng: ưu tiên từ yếu / từ mới --- */
function pickCorrectWord(topicWords) {
  const weighted = topicWords.map(w => ({ w, weight: getWordWeakness(w.word) }));
  const totalW = weighted.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * totalW;
  for (const x of weighted) {
    r -= x.weight;
    if (r <= 0) return x.w;
  }
  return weighted[weighted.length - 1].w;
}

/* --- Chọn từ nhiễu --- */
function pickDistractors(correct, topicWords, count) {
  const pool = [];
  if (memory.level >= 2) {
    for (const group of CONFUSING_GROUPS) {
      if (group.includes(correct.word)) {
        group.forEach(w => {
          if (w !== correct.word) {
            const found = topicWords.find(x => x.word === w);
            if (found && !pool.find(p => p.word === w)) pool.push(found);
          }
        });
      }
    }
  }
  const others = shuffle(topicWords.filter(w =>
    w.word !== correct.word && !pool.find(p => p.word === w.word)
  ));
  while (pool.length < count && others.length > 0) pool.push(others.pop());
  return shuffle(pool).slice(0, count);
}

/* --- Số lựa chọn theo cấp / chuỗi --- */
function getChoiceCount(topicWords) {
  const maxChoices = Math.min(4, topicWords.length);
  if (memory.level === 1) return Math.min(2, maxChoices);
  if (memory.level === 2) return Math.min(3, maxChoices);
  return memory.streak >= 3 ? maxChoices : Math.min(3, maxChoices);
}

/* --- Cập nhật cấp độ --- */
function updateLevel() {
  const total = memory.totalCorrect + memory.totalWrong;
  if (total < 5) { memory.level = 1; return; }
  const acc = memory.totalCorrect / total;
  if (memory.totalCorrect >= 20 && acc >= 0.8) memory.level = 3;
  else if (memory.totalCorrect >= 8 && acc >= 0.7) memory.level = 2;
  else memory.level = 1;
}

/* --- Vòng chơi mới --- */
async function newRound() {
  locked = false;
  wrongThisRound = 0;
  const topic = TOPICS[memory.currentTopic];
  const topicWords = topic.words;

  if (topicWords.length < 2) {
    hintEl.textContent = "⚠️ Chủ đề này cần ít nhất 2 từ!";
    return;
  }

  const correctWord = pickCorrectWord(topicWords);
  const choiceCount = getChoiceCount(topicWords);
  const distractors = pickDistractors(correctWord, topicWords, choiceCount - 1);

  currentChoices = shuffle([correctWord, ...distractors]);
  correctIndex = currentChoices.findIndex(c => c.word === correctWord.word);
  currentWord = correctWord;

  choicesEl.innerHTML = "";
  currentChoices.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "choice";
    renderChoiceContent(div, c);
    div.addEventListener("click", () => handleChoice(i, div));
    choicesEl.appendChild(div);
  });

  hintEl.textContent = "👂 Nghe và chọn hình đúng nhé!";
  hintEl.classList.remove("urgent");

  await speakWord(correctWord.word, 0.8);

  // Đọc lại lần 2 nếu bé chưa chọn sau 2.2s
  setTimeout(() => {
    if (!locked && currentWord && wrongThisRound === 0) {
      speakWord(currentWord.word, 0.75);
    }
  }, 2200);
}

/* --- Bé chọn 1 hình --- */
async function handleChoice(index, el) {
  if (locked) return;

  if (index === correctIndex) {
    /* ===== ĐÚNG ===== */
    locked = true;
    el.classList.add("correct");
    document.querySelectorAll(".choice").forEach(c => c.classList.add("disabled"));

    // Cập nhật điểm
    memory.score++;
    memory.streak++;
    if (memory.streak > memory.bestStreak) memory.bestStreak = memory.streak;
    memory.totalCorrect++;

    const stat = getWordStat(currentWord.word);
    stat.correct++;
    stat.lastSeen = Date.now();

    updateLevel();
    updateStats();
    saveMemory();

    // Hiệu ứng
    playDingSound();
    launchFireworks();
    showPraise();

    // Đọc lời khen (ngẫu nhiên)
    const praise = PRAISES[randInt(PRAISES.length)];
    playApplauseSound();
    await speakPraise(praise);

    // Chuyển câu mới sau 800ms
    setTimeout(newRound, 800);

  } else {
    /* ===== SAI ===== */
    el.classList.add("wrong");
    playWrongSound();
    setTimeout(() => el.classList.remove("wrong"), 500);

    wrongThisRound++;
    memory.streak = 0;
    memory.totalWrong++;
    const stat = getWordStat(currentWord.word);
    stat.wrong++;
    stat.lastSeen = Date.now();
    updateLevel();
    updateStats();
    saveMemory();

    // Sai 2 lần → gợi ý
    if (wrongThisRound >= 2) {
      hintEl.textContent = "💡 Nghe kỹ nhé, hình này nè!";
      hintEl.classList.add("urgent");
      const correctEl = document.querySelectorAll(".choice")[correctIndex];
      correctEl.classList.add("hintGlow");
      setTimeout(() => correctEl.classList.remove("hintGlow"), 4000);
      speakWord(currentWord.word, 0.6);
    }
  }
}

/* --- Nút nghe lại --- */
speakerBtn.addEventListener("click", () => {
  if (!currentWord || locked) return;
  speakerBtn.classList.add("playing");
  speakWord(currentWord.word).then(() => speakerBtn.classList.remove("playing"));
});

/* --- Nút về menu --- */
btnBack.addEventListener("click", showMenu);

/* --- Nút reset --- */
resetBtn.addEventListener("click", () => {
  if (confirm("Xoá toàn bộ tiến độ và chơi lại từ đầu?")) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
});

/* ================================================================
   6. PHÁO HOA
   ================================================================ */
const canvas = document.getElementById("fireworks");
const ctx2d  = canvas.getContext("2d");
let sparks = [];
let animId = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

const COLORS = ["#FF5252","#FFD740","#69F0AE","#40C4FF","#E040FB",
                "#FFAB40","#FF4081","#B2FF59","#18FFFF","#FFEB3B"];

function launchFireworks() {
  const W = canvas.width, H = canvas.height;
  const bursts = [
    { x: W * 0.25, y: H * 0.30 },
    { x: W * 0.75, y: H * 0.28 },
    { x: W * 0.50, y: H * 0.22 },
    { x: W * 0.15, y: H * 0.45 },
    { x: W * 0.85, y: H * 0.45 }
  ];
  bursts.forEach((b, i) => setTimeout(() => createBurst(b.x, b.y), i * 160));
  if (!animId) animateFireworks();
}

function createBurst(x, y) {
  const count = 38 + randInt(18);
  const baseColor = COLORS[randInt(COLORS.length)];
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.25;
    const speed = 2.2 + Math.random() * 4.2;
    sparks.push({
      x, y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, decay: 0.012 + Math.random() * 0.014,
      color: Math.random() < 0.55 ? baseColor : COLORS[randInt(COLORS.length)],
      size: 3 + Math.random() * 5
    });
  }
  for (let i = 0; i < 8; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 2.5;
    sparks.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, decay: 0.02, color: "#FFFFFF", size: 2 + Math.random() * 3
    });
  }
}

function animateFireworks() {
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy;
    s.vy += 0.045; s.vx *= 0.985; s.vy *= 0.985;
    s.life -= s.decay;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }

    ctx2d.globalAlpha = Math.max(s.life, 0);
    ctx2d.fillStyle = s.color;
    ctx2d.beginPath();
    ctx2d.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
    ctx2d.fill();

    ctx2d.globalAlpha = s.life * 0.4;
    ctx2d.beginPath();
    ctx2d.arc(s.x - s.vx * 2, s.y - s.vy * 2, s.size * s.life * 0.6, 0, Math.PI * 2);
    ctx2d.fill();
  }
  ctx2d.globalAlpha = 1;
  if (sparks.length > 0) animId = requestAnimationFrame(animateFireworks);
  else { ctx2d.clearRect(0, 0, canvas.width, canvas.height); animId = null; }
}

/* ================================================================
   7. CHỮ KHEN
   ================================================================ */
function showPraise() {
  praiseEl.textContent = PRAISE_TEXTS[randInt(PRAISE_TEXTS.length)];
  praiseEl.classList.remove("show");
  void praiseEl.offsetWidth;
  praiseEl.classList.add("show");
}

/* ================================================================
   8. KHỞI ĐỘNG
   ================================================================ */
window.addEventListener("load", () => {
  loadMemory();

  // Unlock audio khi bé chạm lần đầu
  document.body.addEventListener("pointerdown", function unlock() {
    try { getAudioCtx().resume(); } catch (e) {}
    try {
      const warm = new SpeechSynthesisUtterance(" ");
      warm.volume = 0;
      speechSynthesis.speak(warm);
    } catch (e) {}
    document.body.removeEventListener("pointerdown", unlock);
  });

  showMenu();
});
</script>
